name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag is published for setup-uv
        with:
          python-version: ${{ matrix.python }}

      # Two tests run the page's JavaScript in Node; pinning it keeps them from silently skipping.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: uv sync --locked

      # The first load of DuckDB's native library is slow on a fresh macOS runner; pay it before the timed tests.
      - name: Warm up
        run: uv run python -c "import duckdb, see_your_agents.app.cli"

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Test
        run: uv run pytest -q
