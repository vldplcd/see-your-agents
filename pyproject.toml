[project]
name = "see-your-agents"
version = "0.1.2"
description = "A local dashboard for Claude Code and Codex CLI sessions: who is working, who is waiting for you, what happened"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND OFL-1.1"  # OFL: the bundled fonts
license-files = ["LICENSE", "src/see_your_agents/web/fonts/OFL-*.txt"]
dependencies = ["duckdb>=1.1"]

[project.urls]
Homepage = "https://github.com/vldplcd/see-your-agents"
Issues = "https://github.com/vldplcd/see-your-agents/issues"
Documentation = "https://github.com/vldplcd/see-your-agents/tree/main/docs"

[project.scripts]
sya = "see_your_agents.app.cli:main"
see-your-agents = "see_your_agents.app.cli:main"  # so that `uvx see-your-agents` finds a command

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639: a license expression and license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/see_your_agents"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/images"]  # the README's pictures, about 2 MB

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
